<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found | {% if settings %}{{ settings.site_title }}{% else %}Atelier Gourmand by OC{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <style>
      .error-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
        padding: 2rem;
      }
      .error-page h1 {
        font-family: 'Playfair Display', serif;
        font-size: 4rem;
        margin-bottom: 0.5rem;
      }
      .error-page p {
        font-family: 'Work Sans', sans-serif;
        font-size: 1.1rem;
        color: #666;
        margin-bottom: 2rem;
      }
      .error-page a {
        font-family: 'Work Sans', sans-serif;
        text-decoration: none;
        border: 1px solid #333;
        padding: 0.75rem 2rem;
        transition: background 0.3s, color 0.3s;
      }
      .error-page a:hover {
        background: #333;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <h1>404</h1>
      <p>The page you're looking for doesn't exist.</p>
      <a href="{{ url_for('index') }}">Return Home</a>
    </div>
  </body>
</html>
